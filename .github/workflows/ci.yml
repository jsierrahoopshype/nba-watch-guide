name: ci

# Branch pushes with an open PR used to run twice (push + pull_request).
# Now: every push to main, and pull requests; a newer push to the same PR
# cancels the older run, which nobody reads.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest
      - name: Check the live feeds
        continue-on-error: true
        run: python -m watchguide verify
