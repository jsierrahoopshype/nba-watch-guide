name: build-watch-guide-daily

on:
  schedule:
    - cron: '0 10 * * *'
    # Second daily run, after the night's games, so pair-page titles move on
    # to the next meeting's date sooner.
    - cron: '0 5 * * *'
    # Two game-evening rebuilds (17:47 and 20:47 ET in winter), October to
    # June only, so no offseason minutes. The how-to-watch-live Worker
    # refreshes availability every 30 minutes but cannot re-render pages:
    # these pick up the referee crews in "Also worth knowing", the injury-
    # driven ranking on the hub and tonight page, and the HTML that readers
    # without JavaScript and crawlers see. Off the hour, where GitHub drops
    # fewer scheduled runs.
    - cron: '47 22 * 10-12,1-6 *'
    - cron: '47 1 * 10-12,1-6 *'
  # Every merge to main rebuilds and publishes, then checks the live site.
  # Doc-only changes don't. The bots' own commits (raw availability copy,
  # recent awards) are pushed with GITHUB_TOKEN, which never starts a run.
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - CLAUDE.md
  workflow_dispatch:
    inputs:
      publish:
        description: 'Push the result to gh-pages'
        type: boolean
        default: true

permissions:
  contents: write

# Shared with the injury refresh so the two never push over each other.
concurrency:
  group: watch-guide-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore the last publish
        run: ./scripts/restore-published.sh site

      - name: Run tests
        run: |
          pip install pytest
          python -m pytest

      - name: Build every page
        id: build
        env:
          # Optional. Set this to a plain pass-through proxy origin if the
          # runner's IP range is ever refused by cdn.nba.com. No key involved.
          NBA_PROXY_BASE: ${{ vars.NBA_PROXY_BASE }}
          # Optional. Point the availability feed somewhere else.
          INJURY_FEED_URL: ${{ vars.INJURY_FEED_URL }}
        run: |
          set +e
          python -m watchguide --out site build
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # 3 means the pages were written from the last good availability data.
          # Publish them, then fail the run at the end.
          if [ "$code" -ne 0 ] && [ "$code" -ne 3 ]; then exit "$code"; fi

      - name: Broadcaster coverage
        run: ./scripts/report-broadcasters.sh site

      - name: Check the output
        run: |
          test -f site/sitemap.xml
          test -f site/data/how-to-watch-links.html
          echo "pages: $(find site -name index.html | wc -l) found, $(grep -c . site/data/expected-pages.txt) expected"
          PUBLISH_CHECK_ONLY=1 ./scripts/publish.sh site
          echo "sitemap urls: $(grep -c '<loc>' site/sitemap.xml || true)"
          ! grep -rl 'github\.io' site/ || (echo 'Pages host leaked into the output' && exit 1)

      - name: Commit the raw availability copy
        run: ./scripts/commit-raw-injuries.sh

      - name: Publish to gh-pages
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: ./scripts/publish.sh site gh-pages

      # Waits (up to 10 minutes, for caching) until hoopsmatic.com serves
      # this run's data/build.json, then checks the hub, miami-heat, tonight
      # and spain for HTTP 200, the built title and no noindex. Runs whenever
      # this run published, including when the availability feed was not
      # trusted; the result goes to the job summary. The 30-minute refresh
      # has no live check.
      - name: Live check
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        run: python scripts/live_check.py --site site --sha "$GITHUB_SHA"

      - name: Fail if the availability feed was not trusted
        if: steps.build.outputs.exit_code == '3'
        run: |
          echo "The pages were published from the last good availability data." >&2
          echo "See the warning in the build step for what went wrong." >&2
          exit 1
