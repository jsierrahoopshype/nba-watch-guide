name: build-watch-guide-daily

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Push the result to gh-pages'
        type: boolean
        default: true
  push:
    branches: [claude/tender-carson-2ars87]   # TEMPORARY: dry run on the feature branch

permissions:
  contents: write

# Shared with the injury refresh so the two never push over each other.
concurrency:
  group: watch-guide-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - name: TEMP feed shape
        run: |
          python - <<'PY'
          from watchguide.sources.http import get
          from watchguide.sources.injuries import feed_url, normalize_name
          from collections import Counter, defaultdict
          rows = get(feed_url(), expect_json=True)
          print("ROWS", len(rows))
          dates = Counter(r.get("date") for r in rows)
          print("DISTINCT_DATES", len(dates))
          print("NEWEST", sorted(dates)[-6:])
          print("OLDEST", sorted(dates)[:4])
          print("ROWS_ON_NEWEST", dates[sorted(dates)[-1]])
          players = defaultdict(list)
          for r in rows: players[normalize_name(r.get("player",""))].append(r)
          print("DISTINCT_PLAYERS", len(players))
          multi = [k for k,v in players.items() if len(v) > 1]
          print("PLAYERS_WITH_MULTIPLE_ROWS", len(multi))
          k = max(players, key=lambda k: len(players[k]))
          print("EXAMPLE", k, len(players[k]))
          for r in sorted(players[k], key=lambda r: r.get("date",""))[-6:]: print("   ", r)
          print("STATUS_ON_NEWEST", Counter(r["status"] for r in rows if r.get("date")==sorted(dates)[-1]))
          PY

      - name: Restore the last publish
        run: ./scripts/restore-published.sh site

      - name: Run tests
        run: |
          pip install pytest
          python -m pytest

      - name: Build every page
        env:
          # Optional. Set this to a plain pass-through proxy origin if the
          # runner's IP range is ever refused by cdn.nba.com. No key involved.
          NBA_PROXY_BASE: ${{ vars.NBA_PROXY_BASE }}
          # Optional. Point the availability feed somewhere else.
          INJURY_FEED_URL: ${{ vars.INJURY_FEED_URL }}
        run: python -m watchguide --out site build

      - name: Check the output
        run: |
          test -f site/sitemap.xml
          echo "pages: $(find site -name index.html | wc -l)"
          echo "sitemap urls: $(grep -c '<loc>' site/sitemap.xml)"
          echo "games today: $(python -c "import json;d=json.load(open('site/data/tonight.json'));print(len(d['games']))")"
          echo "players listed: $(python -c "import json;d=json.load(open('site/data/injuries.json'));print(len(d['players']))")"
          echo "schedule games: $(python -c "import json;d=json.load(open('site/data/schedule.json'));print(d['count'])")"
          echo "--- celtics page channel sample:"
          grep -o 'badge-[a-z]*">[^<]*<' site/boston-celtics/index.html | head -8
          ! grep -rl 'github\.io' site/ || (echo 'Pages host leaked into the output' && exit 1)

      - name: Publish to gh-pages
        if: github.event_name != 'push' && inputs.publish != false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: ./scripts/publish.sh site gh-pages
