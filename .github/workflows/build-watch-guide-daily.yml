name: build-watch-guide-daily

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Push the result to gh-pages'
        type: boolean
        default: true

permissions:
  contents: write

# Shared with the injury refresh so the two never push over each other.
concurrency:
  group: watch-guide-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore the last publish
        run: ./scripts/restore-published.sh site

      - name: Run tests
        run: |
          pip install pytest
          python -m pytest

      - name: Build every page
        id: build
        env:
          # Optional. Set this to a plain pass-through proxy origin if the
          # runner's IP range is ever refused by cdn.nba.com. No key involved.
          NBA_PROXY_BASE: ${{ vars.NBA_PROXY_BASE }}
          # Optional. Point the availability feed somewhere else.
          INJURY_FEED_URL: ${{ vars.INJURY_FEED_URL }}
        run: |
          set +e
          python -m watchguide --out site build
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # 3 means the pages were written from the last good availability data.
          # Publish them, then fail the run at the end.
          if [ "$code" -ne 0 ] && [ "$code" -ne 3 ]; then exit "$code"; fi

      - name: Broadcaster coverage
        run: ./scripts/report-broadcasters.sh site

      - name: Check the output
        run: |
          test -f site/sitemap.xml
          test -f site/data/how-to-watch-links.html
          echo "pages: $(find site -name index.html | wc -l)"
          echo "sitemap urls: $(grep -c '<loc>' site/sitemap.xml || true)"
          ! grep -rl 'github\.io' site/ || (echo 'Pages host leaked into the output' && exit 1)

      - name: Commit the raw availability copy
        run: ./scripts/commit-raw-injuries.sh

      - name: Publish to gh-pages
        if: inputs.publish != false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: ./scripts/publish.sh site gh-pages

      - name: Fail if the availability feed was not trusted
        if: steps.build.outputs.exit_code == '3'
        run: |
          echo "The pages were published from the last good availability data." >&2
          echo "See the warning in the build step for what went wrong." >&2
          exit 1
