name: build-watch-guide-daily

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Push the result to gh-pages'
        type: boolean
        default: true
  push:
    branches: [claude/tender-carson-2ars87]   # TEMPORARY: dry run on the feature branch

permissions:
  contents: write

# Shared with the injury refresh so the two never push over each other.
concurrency:
  group: watch-guide-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore the last publish
        run: ./scripts/restore-published.sh site

      - name: Run tests
        run: |
          pip install pytest
          python -m pytest

      - name: Build every page
        env:
          # Optional. Set this to a plain pass-through proxy origin if the
          # runner's IP range is ever refused by cdn.nba.com. No key involved.
          NBA_PROXY_BASE: ${{ vars.NBA_PROXY_BASE }}
          # Optional. Point the availability feed somewhere else.
          INJURY_FEED_URL: ${{ vars.INJURY_FEED_URL }}
        run: python -m watchguide --out site build

      - name: Check the output
        run: |
          test -f site/sitemap.xml
          echo "pages: $(find site -name index.html | wc -l)"
          echo "sitemap urls: $(grep -c '<loc>' site/sitemap.xml)"
          echo "games today: $(python -c "import json;d=json.load(open('site/data/tonight.json'));print(len(d['games']))")"
          echo "players listed: $(python -c "import json;d=json.load(open('site/data/injuries.json'));print(len(d['players']), d['as_of'])")"
          echo "schedule games: $(python -c "import json;d=json.load(open('site/data/schedule.json'));print(d['count'])")"
          echo "--- celtics page channel sample:"
          grep -o 'badge-[a-z]*">[^<]*<' site/boston-celtics/index.html | head -8
          ! grep -rl 'github\.io' site/ || (echo 'Pages host leaked into the output' && exit 1)

      - name: Publish to gh-pages
        if: github.event_name != 'push' && inputs.publish != false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: ./scripts/publish.sh site gh-pages
