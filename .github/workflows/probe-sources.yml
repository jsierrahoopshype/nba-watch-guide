name: probe-sources
on:
  push:
    branches: [claude/tender-carson-2ars87]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  roster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install curl_cffi
      - run: |
          python - <<'PY'
          from curl_cffi import requests
          import json
          H={"Referer":"https://www.nba.com/","Origin":"https://www.nba.com",
             "Accept":"application/json, text/plain, */*","x-nba-stats-origin":"stats",
             "x-nba-stats-token":"true"}
          cands = [
            "https://cdn.nba.com/static/json/staticData/playerIndex_00.json",
            "https://cdn.nba.com/static/json/staticData/playerIndex.json",
            "https://cdn.nba.com/static/json/liveData/playerIndex/playerIndex_00.json",
            "https://stats.nba.com/stats/playerindex?College=&Country=&DraftPick=&DraftRound=&DraftYear=&Height=&Historical=0&LeagueID=00&Season=2026-27&SeasonType=Regular+Season&TeamID=0&Weight=",
            "https://stats.nba.com/stats/commonallplayers?IsOnlyCurrentSeason=1&LeagueID=00&Season=2026-27",
          ]
          for u in cands:
            try:
              r=requests.get(u, impersonate="chrome", timeout=45, headers=H)
              ct=(r.headers.get("content-type") or "")[:30]
              print("==", u.split("?")[0], r.status_code, len(r.content), ct)
              if r.status_code==200:
                try:
                  d=r.json()
                  if isinstance(d,dict):
                    print("   keys", list(d.keys())[:8])
                    rs=d.get("resultSets") or d.get("resultSet")
                    if rs:
                      print("   headers", rs[0].get("headers"))
                      print("   row0", rs[0].get("rowSet",[[]])[0] if rs[0].get("rowSet") else None)
                      print("   nrows", len(rs[0].get("rowSet") or []))
                    else:
                      print("   sample", json.dumps(d)[:400])
                  else:
                    print("   list len", len(d), json.dumps(d[:2])[:400])
                except Exception as e: print("   notjson", r.text[:150])
            except Exception as e:
              print("==", u.split("?")[0], "ERR", type(e).__name__, str(e)[:90])
          PY
