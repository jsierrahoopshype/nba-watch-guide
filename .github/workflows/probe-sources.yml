name: probe-sources
on:
  push:
    branches: [claude/tender-carson-2ars87]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install curl_cffi
      - name: Schedule structure
        run: |
          python - <<'PY'
          from curl_cffi import requests
          from collections import Counter
          import json
          H = {"Referer": "https://www.nba.com/", "Origin": "https://www.nba.com"}
          r = requests.get("https://cdn.nba.com/static/json/staticData/scheduleLeagueV2.json",
                           impersonate="chrome", timeout=90, headers=H)
          print("STATUS", r.status_code, len(r.content))
          d = r.json()
          ls = d["leagueSchedule"]
          print("TOP", list(d.keys()), "LS", list(ls.keys()))
          print("SEASONYEAR", repr(ls.get("seasonYear")), "LEAGUEID", ls.get("leagueId"))
          gds = ls["gameDates"]
          print("GAMEDATES", len(gds), "FIRST", gds[0]["gameDate"], "LAST", gds[-1]["gameDate"])
          pref = Counter(); natl=Counter(); ott=Counter(); loc=Counter(); radio=Counter()
          sample=None; sample_local=None
          for gd in gds:
            for g in gd["games"]:
              pref[g["gameId"][:3]] += 1
              if g["gameId"][:3] != "002": continue
              b = g.get("broadcasters") or {}
              for x in b.get("nationalTvBroadcasters") or []: natl[x.get("broadcasterAbbreviation")]+=1
              for x in b.get("nationalOttBroadcasters") or []: ott[x.get("broadcasterAbbreviation")]+=1
              for k in ("homeTvBroadcasters","awayTvBroadcasters"):
                for x in b.get(k) or []: loc[x.get("broadcasterAbbreviation")]+=1
              if sample is None and (b.get("nationalTvBroadcasters") or b.get("nationalOttBroadcasters")): sample=g
              if sample_local is None and (b.get("homeTvBroadcasters")): sample_local=g
          print("PREFIXES", dict(pref))
          print("NATIONAL_TV", natl.most_common())
          print("NATIONAL_OTT", ott.most_common())
          print("LOCAL_TV", loc.most_common(80))
          print("SAMPLE_NATIONAL", json.dumps(sample, indent=1)[:3500])
          print("SAMPLE_LOCAL_BROADCASTERS", json.dumps((sample_local or {}).get("broadcasters"), indent=1)[:2500])
          teams={}
          for gd in gds:
            for g in gd["games"]:
              if g["gameId"][:3]!="002": continue
              for k in ("homeTeam","awayTeam"):
                t=g[k]
                if t.get("teamId"): teams[t["teamId"]]=(t.get("teamTricode"),t.get("teamCity"),t.get("teamName"),t.get("teamSlug"))
          print("TEAMS", len(teams))
          for tid,v in sorted(teams.items(), key=lambda x:x[1][0]): print("  ",tid,v)
          PY
      - name: Injury report discovery
        run: |
          python - <<'PY'
          from curl_cffi import requests
          import re
          H = {"Referer": "https://www.nba.com/"}
          for u in ["https://official.nba.com/nba-injury-report-2025-26-season/",
                    "https://official.nba.com/nba-injury-report-2026-27-season/",
                    "https://official.nba.com/injury-report/"]:
            try:
              r = requests.get(u, impersonate="chrome", timeout=60, headers=H)
              print("==", u, r.status_code, len(r.content))
              t = r.text
              for pat in [r'https?://[^"\'\s<>]*[Ii]njury[^"\'\s<>]*', r'Injury-Report[^"\'\s<>]*']:
                hits = sorted(set(re.findall(pat, t)))[:15]
                for h in hits: print("   ", h[:160])
            except Exception as e:
              print("==", u, "ERR", type(e).__name__, str(e)[:100])
          # direct PDF pattern against a date in last season
          for d, tm in [("2026-04-10","05PM"),("2026-04-10","01PM"),("2026-01-15","05PM"),("2026-01-15","01PM")]:
            u=f"https://ak-static.cms.nba.com/referee/injury/Injury-Report_{d}_{tm}.pdf"
            try:
              r = requests.get(u, impersonate="chrome", timeout=45, headers=H)
              print(u, "->", r.status_code, len(r.content), (r.headers.get("content-type") or "")[:40])
            except Exception as e:
              print(u, "ERR", type(e).__name__, str(e)[:80])
          PY
      - name: HoopsMatic look
        run: |
          python - <<'PY'
          from curl_cffi import requests
          import re
          for u in ["https://hoopsmatic.com/","https://hoopsmatic.com/compare","https://hoopsmatic.com/depth-charts"]:
            try:
              r = requests.get(u, impersonate="chrome", timeout=60)
              print("==", u, r.status_code, len(r.content))
              t = r.text
              if r.status_code != 200:
                print("   body:", t[:200].replace("\n"," ")); continue
              for pat, lbl in [(r'--[a-z0-9-]+\s*:\s*[^;}]{1,60}', "cssvar"),
                               (r'font-family\s*:\s*[^;}]{1,120}', "font"),
                               (r'fonts\.googleapis\.com[^"\']{0,120}', "gfont"),
                               (r'(?:href|src)="[^"]+\.(?:css|js)[^"]*"', "asset"),
                               (r'#[0-9a-fA-F]{6}\b', "hex")]:
                hits = sorted(set(re.findall(pat, t)))
                print(f"  --{lbl} ({len(hits)}):")
                for h in hits[:45]: print("     ", h.strip()[:110])
              m = re.findall(r'(?:fetch|url)\(["\']([^"\']+)["\']', t)
              print("  --fetches:", sorted(set(m))[:25])
            except Exception as e:
              print("==", u, "ERR", type(e).__name__, str(e)[:120])
          PY
