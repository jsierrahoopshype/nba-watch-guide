name: probe-sources
on:
  push:
    branches: [claude/tender-carson-2ars87]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install curl_cffi
      - run: |
          python - <<'PY'
          from curl_cffi import requests
          import json
          u="https://aderoa.github.io/Injuries/injuries.json"
          r=requests.get(u, impersonate="chrome", timeout=60)
          print("STATUS", r.status_code, len(r.content), r.headers.get("last-modified"))
          d=r.json()
          print("TYPE", type(d).__name__)
          if isinstance(d, dict):
            print("KEYS", list(d.keys())[:40])
            for k in list(d.keys())[:4]:
              print("  ", k, "=>", json.dumps(d[k])[:600])
          else:
            print("LEN", len(d))
            print(json.dumps(d[:6], indent=1)[:2500])
            vals=set()
            for row in d:
              if isinstance(row, dict):
                for key in ("status","Status","injuryStatus"):
                  if key in row: vals.add((key, str(row[key])))
            print("STATUS_VALUES", sorted(vals)[:40])
            if d and isinstance(d[0], dict): print("ROWKEYS", sorted(d[0].keys()))
          PY
      - name: how depth-charts uses it
        run: |
          python - <<'PY'
          from curl_cffi import requests
          import re
          t = requests.get("https://hoopsmatic.com/depth-charts", impersonate="chrome", timeout=60).text
          i = t.find("aderoa.github.io/Injuries")
          print(t[max(0,i-1500):i+2500])
          PY
