name: probe-sources
on:
  push:
    branches: [claude/tender-carson-2ars87]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sched:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install curl_cffi
      - run: |
          python - <<'PY'
          from curl_cffi import requests
          from collections import Counter
          import json
          H={"Referer":"https://www.nba.com/","Origin":"https://www.nba.com"}
          d=requests.get("https://cdn.nba.com/static/json/staticData/scheduleLeagueV2.json",
                         impersonate="chrome",timeout=90,headers=H).json()
          ls=d["leagueSchedule"]; gds=ls["gameDates"]
          out={}
          out["seasonYear"]=ls.get("seasonYear")
          out["lsKeys"]=list(ls.keys())
          out["gameDates"]=len(gds); out["first"]=gds[0]["gameDate"]; out["last"]=gds[-1]["gameDate"]
          pref=Counter(); natl=Counter(); ott=Counter(); loc=Counter(); nat_games=0; reg=0; nolocal=0
          weeks=set(); sample=None
          for gd in gds:
            for g in gd["games"]:
              pref[g["gameId"][:3]]+=1
              if g["gameId"][:3]!="002": continue
              reg+=1; weeks.add(g.get("weekNumber"))
              b=g.get("broadcasters") or {}
              n=b.get("nationalTvBroadcasters") or []; o=b.get("nationalOttBroadcasters") or []
              if n or o: nat_games+=1
              for x in n: natl[x.get("broadcasterAbbreviation")]+=1
              for x in o: ott[x.get("broadcasterAbbreviation")]+=1
              ht=b.get("homeTvBroadcasters") or []; at=b.get("awayTvBroadcasters") or []
              for x in ht+at: loc[x.get("broadcasterAbbreviation")]+=1
              if not ht and not at and not n and not o: nolocal+=1
              if sample is None: sample={k:g.get(k) for k in ("gameId","gameCode","gameStatus","gameStatusText","gameDateEst","gameTimeEst","gameDateTimeEst","gameDateUTC","gameDateTimeUTC","weekNumber","arenaName","arenaCity","arenaState","gameLabel","seriesText")}
                                 
          out["prefixes"]=dict(pref); out["regular"]=reg; out["nationalGames"]=nat_games
          out["noBroadcasterAtAll"]=nolocal
          out["nationalTv"]=natl.most_common(); out["nationalOtt"]=ott.most_common()
          out["localCodes"]=loc.most_common(90)
          out["sampleGame"]=sample
          out["gameKeys"]=sorted(gds[0]["games"][0].keys())
          out["homeTeamKeys"]=sorted(gds[0]["games"][0]["homeTeam"].keys())
          print("###JSON###"); print(json.dumps(out, indent=1))
          PY
