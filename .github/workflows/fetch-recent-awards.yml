name: fetch-recent-awards

# Rebuilds data/recent_awards.json from Wikipedia (the All-Star Game pages and
# the All-NBA Team page) and commits it to the branch it was run on. Run it by
# hand once a season's All-NBA teams are announced, after moving the season
# window in data/star_power_weights.json. It refuses to write a list that
# looks incomplete.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-recent-awards-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch and extract
        run: python scripts/fetch_recent_awards.py
      - name: Commit the extract if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/recent_awards.json
          git diff --cached --quiet && { echo "recent_awards.json unchanged"; exit 0; }
          git commit -q -m "Update recent awards from Wikipedia"
          git push -q origin "HEAD:${GITHUB_REF_NAME}"
